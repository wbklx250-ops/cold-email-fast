[build]
builder = "dockerfile"
# Dockerfile now lives under backend/ so Railway can use either:
#   - Root Directory = <empty> + dockerfilePath = "backend/Dockerfile"   (this file)
#   - Root Directory = "backend" + dockerfilePath = "Dockerfile"         (backend/railway.toml if present)
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1
